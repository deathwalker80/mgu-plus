name: Build MGU Plus

# Ogni push su main costruisce l'exe su Windows (con i test). Se la versione
# scritta in gui.py (APP_VERSION) non ha ancora una release, la pubblica con lo
# zip e il tag vX.Y.Z. Con la riga <!-- prerelease --> in RELEASE_NOTES.md esce
# come pre-release: il controllo aggiornamenti dentro MGU Plus vede solo le
# release definitive (togliere la spunta "pre-release" su GitHub dopo le prove).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versione
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $app = (Select-String -Path gui.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $bat = (Select-String -Path build_exe.bat -Pattern 'set "VERSION=(.+)"').Matches[0].Groups[1].Value
          if ($app -ne $bat) { throw "APP_VERSION $app in gui.py diverso da VERSION $bat in build_exe.bat" }
          gh release view "v$app" --repo "${{ github.repository }}" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          "version=$app" >> $env:GITHUB_OUTPUT
          "release=$(-not $exists)".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "MGU Plus $app - release gia' pubblicata: $exists"
      - name: Build
        shell: cmd
        run: build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: MGU-Plus-windows-${{ steps.version.outputs.version }}
          path: dist/MGU-Plus-windows-*.zip
      - name: Release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zip = (Get-ChildItem dist/MGU-Plus-windows-*.zip).FullName
          $args = @("v$ver", $zip, "--target", "${{ github.sha }}", "--title", "MGU Plus $ver", "--notes-file", "RELEASE_NOTES.md")
          if (Select-String -Path RELEASE_NOTES.md -Pattern '<!-- prerelease -->' -Quiet) { $args += "--prerelease" }
          gh release create @args
